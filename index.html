<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Fun! /ou/ & /ow/ Sounds</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Fredoka One', cursive;
        }
        .flashcard {
            perspective: 1000px;
            cursor: pointer;
        }
        .flashcard-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
        
        /* Interactive animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

    <!-- Header -->
    <header class="bg-white shadow-md p-4 sticky top-0 z-50 rounded-b-3xl mb-8 border-b-4 border-green-400">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-green-600">
                <i class="fa-solid fa-graduation-cap text-4xl"></i>
                <h1 class="text-3xl text-green-500 tracking-wide text-center md:text-left">Phonics Fun: /ou/ & /ow/</h1>
            </div>
            
            <!-- Navigation -->
            <nav class="flex flex-wrap justify-center gap-2">
                <button onclick="switchGame('flashcards')" id="nav-flashcards" class="nav-btn px-4 py-2 rounded-full font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors border-2 border-blue-300">
                    <i class="fa-regular fa-images mr-1"></i> Flashcards
                </button>
                <button onclick="switchGame('listenMatch')" id="nav-listenMatch" class="nav-btn px-4 py-2 rounded-full font-bold bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition-colors border-2 border-yellow-300">
                    <i class="fa-solid fa-ear-listen mr-1"></i> Listen & Match
                </button>
                <button onclick="switchGame('phonemeClick')" id="nav-phonemeClick" class="nav-btn px-4 py-2 rounded-full font-bold bg-purple-100 text-purple-700 hover:bg-purple-200 transition-colors border-2 border-purple-300">
                    <i class="fa-solid fa-font mr-1"></i> Pick Phoneme
                </button>
                <button onclick="switchGame('amharicMatch')" id="nav-amharicMatch" class="nav-btn px-4 py-2 rounded-full font-bold bg-pink-100 text-pink-700 hover:bg-pink-200 transition-colors border-2 border-pink-300">
                    <i class="fa-solid fa-language mr-1"></i> Amharic Match
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Game Container -->
    <main id="game-container" class="max-w-5xl mx-auto w-full px-4 flex-grow">
        <!-- Dynamic content injected here -->
    </main>

    <!-- Audio Helper (Hidden) -->
    <script>
        // --- Data Setup based on user document ---
        const wordsData = [
            { en: "Out", am: "ውጭ (Wich)", phoneme: "ou", img: "https://placehold.co/300x300/ffb3ba/000000?text=Out" },
            { en: "House", am: "ቤት (Bet)", phoneme: "ou", img: "https://placehold.co/300x300/ffdfba/000000?text=House" },
            { en: "Mouse", am: "አይጥ (Ayt)", phoneme: "ou", img: "https://placehold.co/300x300/ffffba/000000?text=Mouse" },
            { en: "Cloud", am: "ደመና (Demena)", phoneme: "ou", img: "https://placehold.co/300x300/baffc9/000000?text=Cloud" },
            { en: "Mouth", am: "አፍ (Af)", phoneme: "ou", img: "https://placehold.co/300x300/bae1ff/000000?text=Mouth" },
            { en: "Loud", am: "ጮክ ያለ (Chok yale)", phoneme: "ou", img: "https://placehold.co/300x300/e8baff/000000?text=Loud" },
            
            { en: "Cow", am: "ላም (Lam)", phoneme: "ow", img: "https://placehold.co/300x300/ffb3ba/000000?text=Cow" },
            { en: "Now", am: "አሁን (Ahun)", phoneme: "ow", img: "https://placehold.co/300x300/ffdfba/000000?text=Now" },
            { en: "Down", am: "ታች (Tach)", phoneme: "ow", img: "https://placehold.co/300x300/ffffba/000000?text=Down" },
            { en: "Town", am: "ከተማ (Ketema)", phoneme: "ow", img: "https://placehold.co/300x300/baffc9/000000?text=Town" },
            { en: "Brown", am: "ቡናማ (Bunama)", phoneme: "ow", img: "https://placehold.co/300x300/bae1ff/000000?text=Brown" },
            { en: "Owl", am: "ጉጉት (Gugut)", phoneme: "ow", img: "https://placehold.co/300x300/e8baff/000000?text=Owl" },
            { en: "Flower", am: "አበባ (Abeba)", phoneme: "ow", img: "https://placehold.co/300x300/ffc4e1/000000?text=Flower" }
        ];

        // --- Audio System ---
        let ukFemaleVoice = null;
        
        function initVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Try to find a British female voice
            ukFemaleVoice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Female') || v.name.includes('Google UK English Female'))) 
                            || voices.find(v => v.lang === 'en-GB') 
                            || voices[0]; 
        }

        window.speechSynthesis.onvoiceschanged = initVoices;
        
        function playAudio(text, event) {
            if(event) event.stopPropagation(); // Prevent triggering parent clicks
            
            if(!ukFemaleVoice) initVoices();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = ukFemaleVoice;
            utterance.rate = 0.85; // Slightly slower for kids
            utterance.pitch = 1.1; // Slightly higher pitch for friendly tone
            window.speechSynthesis.speak(utterance);
        }

        // --- Game State & Utility ---
        const container = document.getElementById('game-container');
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setActiveNav(mode) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-offset-2', 'ring-opacity-50');
                if(btn.id === `nav-${mode}`) {
                    btn.classList.add(`ring-4`, `ring-${btn.classList.contains('text-blue-700') ? 'blue' : btn.classList.contains('text-yellow-700') ? 'yellow' : btn.classList.contains('text-purple-700') ? 'purple' : 'pink'}-400`);
                }
            });
        }

        // --- Core Application Logic ---
        function switchGame(mode) {
            setActiveNav(mode);
            window.speechSynthesis.cancel(); // Stop any ongoing speech
            
            switch(mode) {
                case 'flashcards': renderFlashcards(); break;
                case 'listenMatch': renderListenMatch(); break;
                case 'phonemeClick': renderPhonemeClick(); break;
                case 'amharicMatch': renderAmharicMatch(); break;
            }
        }

        // ---------------------------------------------------------
        // GAME 1: Interactive Flashcards
        // ---------------------------------------------------------
        function renderFlashcards() {
            container.innerHTML = `
                <div class="text-center mb-8">
                    <h2 class="text-4xl brand-font text-blue-600 mb-2">Interactive Flashcards</h2>
                    <div class="inline-block bg-blue-100 border-2 border-blue-300 rounded-full px-6 py-2 mb-4 shadow-sm">
                        <span class="text-2xl brand-font text-blue-800">/ou/ = /ow/ = /አው/</span>
                    </div>
                    <p class="text-gray-600 text-lg">Click the card to flip! Click the speaker to hear the word.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-12" id="flashcard-grid">
                </div>
            `;
            
            const grid = document.getElementById('flashcard-grid');
            const shuffledWords = shuffleArray([...wordsData]);

            shuffledWords.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = "flashcard h-64 rounded-2xl bg-transparent";
                card.onclick = () => {
                    card.classList.toggle('flipped');
                };

                card.innerHTML = `
                    <div class="flashcard-inner rounded-2xl shadow-xl w-full h-full">
                        <!-- Front -->
                        <div class="flashcard-front bg-white rounded-2xl p-4 flex flex-col items-center justify-center border-4 border-blue-200">
                            <span class="text-xs md:text-sm font-bold text-purple-700 mb-2 bg-purple-100 px-3 py-1 rounded-full brand-font tracking-wide">/ou/ = /ow/ = /አው/</span>
                            <img src="${word.img}" alt="${word.en}" class="w-28 h-28 object-cover rounded-xl mb-3 border-2 border-gray-100 shadow-sm">
                            <button onclick="playAudio('${word.en}', event)" class="w-10 h-10 rounded-full bg-blue-500 text-white hover:bg-blue-600 flex items-center justify-center text-lg transition-transform hover:scale-110 shadow-md">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <!-- Back -->
                        <div class="flashcard-back bg-blue-50 rounded-2xl p-4 flex flex-col items-center justify-center border-4 border-blue-400 relative">
                            <span class="text-xs md:text-sm font-bold text-purple-700 mb-2 bg-purple-100 px-3 py-1 rounded-full brand-font tracking-wide z-10">/ou/ = /ow/ = /አው/</span>
                            <h3 class="text-3xl brand-font text-blue-800 mb-1 z-10">${word.en}</h3>
                            <div class="text-6xl brand-font text-orange-500 mb-2 opacity-20 absolute top-2 right-2">${word.phoneme}</div>
                            <p class="text-xl font-bold text-gray-700 mb-3 z-10">${word.am}</p>
                            <button onclick="playAudio('${word.en}', event)" class="w-10 h-10 rounded-full bg-blue-500 text-white hover:bg-blue-600 flex items-center justify-center text-lg transition-transform hover:scale-110 shadow-md z-10">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ---------------------------------------------------------
        // GAME 2: Listen & Match
        // ---------------------------------------------------------
        let lm_currentWord = null;
        function renderListenMatch() {
            container.innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-4xl brand-font text-yellow-600 mb-2">Listen & Match</h2>
                    <div class="inline-block bg-yellow-100 border-2 border-yellow-300 rounded-full px-6 py-2 mb-4 shadow-sm">
                        <span class="text-2xl brand-font text-yellow-800">/ou/ = /ow/ = /አው/</span>
                    </div>
                    <p class="text-gray-600 text-lg">Click the big play button, then choose the correct picture!</p>
                </div>
                
                <div class="flex flex-col items-center bg-white p-8 rounded-3xl shadow-xl border-4 border-yellow-200">
                    
                    <button id="lm-play-btn" class="w-32 h-32 rounded-full bg-yellow-400 text-white shadow-[0_8px_0_#ca8a04] hover:mt-2 hover:shadow-[0_6px_0_#ca8a04] active:mt-8 active:shadow-none transition-all flex items-center justify-center text-6xl mb-10">
                        <i class="fa-solid fa-play ml-2"></i>
                    </button>
                    
                    <div id="lm-feedback" class="h-10 text-2xl font-bold mb-4"></div>

                    <div id="lm-options" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
                        <!-- Options injected here -->
                    </div>
                    
                    <button id="lm-next-btn" class="mt-8 px-8 py-3 bg-gray-300 text-gray-500 font-bold rounded-full text-xl hidden transition-colors">
                        Next Word <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            `;

            setupNextListenMatch();
        }

        function setupNextListenMatch() {
            const optionsContainer = document.getElementById('lm-options');
            const feedback = document.getElementById('lm-feedback');
            const nextBtn = document.getElementById('lm-next-btn');
            const playBtn = document.getElementById('lm-play-btn');
            
            feedback.innerHTML = "";
            nextBtn.classList.add('hidden');
            
            // Pick a random target word
            lm_currentWord = wordsData[Math.floor(Math.random() * wordsData.length)];
            
            // Pick 2 wrong options
            let wrongOptions = wordsData.filter(w => w.en !== lm_currentWord.en);
            wrongOptions = shuffleArray(wrongOptions).slice(0, 2);
            
            let currentOptions = shuffleArray([lm_currentWord, ...wrongOptions]);

            playBtn.onclick = () => playAudio(lm_currentWord.en, null);
            // Auto play on load
            setTimeout(() => playAudio(lm_currentWord.en, null), 500);

            optionsContainer.innerHTML = '';
            currentOptions.forEach(opt => {
                const optBtn = document.createElement('div');
                optBtn.className = "cursor-pointer bg-gray-50 rounded-2xl p-4 border-4 border-gray-200 hover:border-yellow-400 hover:shadow-lg transition-all flex flex-col items-center group";
                optBtn.innerHTML = `
                    <img src="${opt.img}" class="w-full aspect-square object-cover rounded-xl mb-4 group-hover:scale-105 transition-transform">
                `;
                optBtn.onclick = () => handleListenMatchSelection(opt, optBtn);
                optionsContainer.appendChild(optBtn);
            });

            nextBtn.onclick = setupNextListenMatch;
        }

        function handleListenMatchSelection(selectedOpt, btnElement) {
            const feedback = document.getElementById('lm-feedback');
            const options = document.getElementById('lm-options').children;
            
            // Disable further clicks
            Array.from(options).forEach(opt => opt.style.pointerEvents = 'none');

            if(selectedOpt.en === lm_currentWord.en) {
                btnElement.classList.remove('border-gray-200', 'hover:border-yellow-400');
                btnElement.classList.add('border-green-500', 'bg-green-50', 'animate-pop');
                feedback.innerHTML = `<span class="text-green-500"><i class="fa-solid fa-star"></i> Excellent! It is ${selectedOpt.en}!</span>`;
                playAudio("Correct! " + selectedOpt.en, null);
                document.getElementById('lm-next-btn').classList.remove('hidden');
                document.getElementById('lm-next-btn').className = "mt-8 px-8 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-full text-xl shadow-lg transition-colors";
            } else {
                btnElement.classList.remove('border-gray-200', 'hover:border-yellow-400');
                btnElement.classList.add('border-red-500', 'bg-red-50', 'animate-shake');
                feedback.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-circle-xmark"></i> Oops! Try again!</span>`;
                setTimeout(() => {
                    // Reset
                    Array.from(options).forEach(opt => opt.style.pointerEvents = 'auto');
                    btnElement.classList.remove('border-red-500', 'bg-red-50', 'animate-shake');
                    btnElement.classList.add('border-gray-200');
                    feedback.innerHTML = "";
                }, 1500);
            }
        }

        // ---------------------------------------------------------
        // GAME 3: Click the Correct Phoneme
        // ---------------------------------------------------------
        let pc_currentWord = null;
        function renderPhonemeClick() {
            container.innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-4xl brand-font text-purple-600 mb-2">Pick the Phoneme</h2>
                    <div class="inline-block bg-purple-100 border-2 border-purple-300 rounded-full px-6 py-2 mb-4 shadow-sm">
                        <span class="text-2xl brand-font text-purple-800">/ou/ = /ow/ = /አው/</span>
                    </div>
                    <p class="text-gray-600 text-lg">Look at the word and pick the correct sound: <span class="font-bold text-xl text-purple-700">ou</span> or <span class="font-bold text-xl text-purple-700">ow</span>!</p>
                </div>
                
                <div class="flex flex-col items-center bg-white p-8 rounded-3xl shadow-xl border-4 border-purple-200">
                    
                    <div id="pc-card" class="mb-10 bg-purple-50 p-6 rounded-2xl border-4 border-purple-100 flex flex-col items-center">
                        <!-- Content injected here -->
                    </div>

                    <div id="pc-feedback" class="h-10 text-2xl font-bold mb-4"></div>

                    <div class="flex gap-8 justify-center w-full max-w-2xl">
                        <button onclick="handlePhonemeClick('ou', this)" class="pc-btn flex-1 bg-white border-8 border-pink-400 text-pink-500 hover:bg-pink-50 hover:-translate-y-2 rounded-3xl p-8 shadow-[0_10px_0_#f472b6] active:translate-y-2 active:shadow-none transition-all flex flex-col items-center justify-center">
                            <span class="text-7xl brand-font">ou</span>
                            <span class="text-lg font-bold mt-2 text-gray-500">like in "out"</span>
                        </button>
                        
                        <button onclick="handlePhonemeClick('ow', this)" class="pc-btn flex-1 bg-white border-8 border-cyan-400 text-cyan-500 hover:bg-cyan-50 hover:-translate-y-2 rounded-3xl p-8 shadow-[0_10px_0_#22d3ee] active:translate-y-2 active:shadow-none transition-all flex flex-col items-center justify-center">
                            <span class="text-7xl brand-font">ow</span>
                            <span class="text-lg font-bold mt-2 text-gray-500">like in "cow"</span>
                        </button>
                    </div>
                    
                    <button id="pc-next-btn" class="mt-8 px-8 py-3 bg-purple-500 hover:bg-purple-600 text-white font-bold rounded-full text-xl hidden shadow-lg transition-colors">
                        Next Word <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            `;
            setupNextPhonemeClick();
        }

        function setupNextPhonemeClick() {
            const card = document.getElementById('pc-card');
            const feedback = document.getElementById('pc-feedback');
            const nextBtn = document.getElementById('pc-next-btn');
            
            feedback.innerHTML = "";
            nextBtn.classList.add('hidden');
            
            // Reset buttons
            document.querySelectorAll('.pc-btn').forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.classList.remove('opacity-50', 'scale-90');
            });
            
            pc_currentWord = wordsData[Math.floor(Math.random() * wordsData.length)];
            
            // Highlight the phoneme blanks if we wanted, but let's just show word and image with audio
            // Replace the phoneme with blanks for a challenge
            const wordDisplay = pc_currentWord.en.toLowerCase().replace(pc_currentWord.phoneme, "<span class='text-purple-300'>__</span>");
            const wordTitleCase = wordDisplay.charAt(0).toUpperCase() + wordDisplay.slice(1);

            card.innerHTML = `
                <img src="${pc_currentWord.img}" class="w-40 h-40 object-cover rounded-xl mb-4 shadow-sm border-2 border-white">
                <div class="flex items-center gap-4">
                    <h3 class="text-5xl font-bold tracking-widest text-gray-800">${wordTitleCase}</h3>
                    <button onclick="playAudio('${pc_currentWord.en}', event)" class="w-12 h-12 rounded-full bg-purple-500 text-white hover:bg-purple-600 flex items-center justify-center text-xl shadow-md transition-transform hover:scale-110">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            `;
            
            // Play initial audio
            setTimeout(() => playAudio(pc_currentWord.en, null), 400);

            nextBtn.onclick = setupNextPhonemeClick;
        }

        function handlePhonemeClick(selectedPhoneme, btnElement) {
            const feedback = document.getElementById('pc-feedback');
            const nextBtn = document.getElementById('pc-next-btn');
            
            document.querySelectorAll('.pc-btn').forEach(btn => btn.style.pointerEvents = 'none');

            if(selectedPhoneme === pc_currentWord.phoneme) {
                btnElement.classList.add('animate-pop');
                feedback.innerHTML = `<span class="text-green-500"><i class="fa-solid fa-check-circle"></i> Brilliant! It is spelled with ${selectedPhoneme}.</span>`;
                playAudio("Correct! " + pc_currentWord.en, null);
                
                // Show the full word
                const cardTitle = document.querySelector('#pc-card h3');
                cardTitle.innerHTML = pc_currentWord.en;
                cardTitle.classList.add('text-green-600');

                nextBtn.classList.remove('hidden');
            } else {
                btnElement.classList.add('animate-shake', 'opacity-50', 'scale-90');
                feedback.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-circle-xmark"></i> Not quite!</span>`;
                playAudio("Try again", null);
                
                setTimeout(() => {
                    document.querySelectorAll('.pc-btn').forEach(btn => btn.style.pointerEvents = 'auto');
                    btnElement.classList.remove('animate-shake', 'opacity-50', 'scale-90');
                    feedback.innerHTML = "";
                }, 1500);
            }
        }


        // ---------------------------------------------------------
        // GAME 4: Amharic vs English Match
        // ---------------------------------------------------------
        let am_selectedEn = null;
        let am_selectedAm = null;
        let am_matchesFound = 0;
        let am_totalPairs = 5;

        function renderAmharicMatch() {
            container.innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-4xl brand-font text-pink-600 mb-2">Amharic Matchmaker</h2>
                    <div class="inline-block bg-pink-100 border-2 border-pink-300 rounded-full px-6 py-2 mb-4 shadow-sm">
                        <span class="text-2xl brand-font text-pink-800">/ou/ = /ow/ = /አው/</span>
                    </div>
                    <p class="text-gray-600 text-lg">Click an English word on the left, then click its Amharic meaning on the right!</p>
                </div>
                
                <div class="bg-white p-8 rounded-3xl shadow-xl border-4 border-pink-200">
                    <div id="am-feedback" class="h-8 text-xl font-bold mb-4 text-center text-pink-500">Find ${am_totalPairs} matches!</div>
                    
                    <div class="flex flex-col md:flex-row gap-8 justify-center">
                        <div class="flex-1 flex flex-col gap-3" id="am-en-col"></div>
                        <div class="flex-1 flex flex-col gap-3" id="am-am-col"></div>
                    </div>
                    
                    <div class="mt-8 text-center hidden" id="am-win-container">
                        <h3 class="text-3xl text-green-500 brand-font mb-4">You matched them all! 🎉</h3>
                        <button onclick="renderAmharicMatch()" class="px-8 py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full text-xl shadow-lg transition-colors">
                            Play Again <i class="fa-solid fa-rotate-right ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
            
            setupAmharicMatch();
        }

        function setupAmharicMatch() {
            am_selectedEn = null;
            am_selectedAm = null;
            am_matchesFound = 0;
            
            const enCol = document.getElementById('am-en-col');
            const amCol = document.getElementById('am-am-col');
            
            // Select random pairs
            let selectedPairs = shuffleArray([...wordsData]).slice(0, am_totalPairs);
            
            let enWords = shuffleArray([...selectedPairs]);
            let amWords = shuffleArray([...selectedPairs]);

            enWords.forEach(word => {
                const btn = document.createElement('button');
                btn.className = "am-btn-en w-full p-4 text-left bg-pink-50 border-2 border-pink-200 rounded-xl text-xl font-bold text-gray-700 hover:bg-pink-100 hover:border-pink-400 transition-all flex justify-between items-center";
                btn.innerHTML = `
                    <span>${word.en}</span>
                    <i class="fa-solid fa-volume-high text-pink-400 hover:text-pink-600 p-2" onclick="playAudio('${word.en}', event)"></i>
                `;
                btn.onclick = () => handleAmharicSelection('en', word, btn);
                enCol.appendChild(btn);
            });

            amWords.forEach(word => {
                const btn = document.createElement('button');
                btn.className = "am-btn-am w-full p-4 text-center bg-teal-50 border-2 border-teal-200 rounded-xl text-xl font-bold text-gray-700 hover:bg-teal-100 hover:border-teal-400 transition-all";
                btn.innerHTML = word.am;
                btn.onclick = () => handleAmharicSelection('am', word, btn);
                amCol.appendChild(btn);
            });
        }

        function handleAmharicSelection(type, word, btnElement) {
            // Ignore if already matched
            if(btnElement.classList.contains('matched')) return;

            const feedback = document.getElementById('am-feedback');

            if(type === 'en') {
                // Clear previous selection in this column
                document.querySelectorAll('.am-btn-en:not(.matched)').forEach(b => b.classList.remove('bg-pink-200', 'border-pink-500'));
                btnElement.classList.add('bg-pink-200', 'border-pink-500');
                am_selectedEn = {word, btn: btnElement};
                playAudio(word.en, null);
            } else {
                // Clear previous
                document.querySelectorAll('.am-btn-am:not(.matched)').forEach(b => b.classList.remove('bg-teal-200', 'border-teal-500'));
                btnElement.classList.add('bg-teal-200', 'border-teal-500');
                am_selectedAm = {word, btn: btnElement};
            }

            // Check match if both selected
            if(am_selectedEn && am_selectedAm) {
                // Lock interaction temporarily
                const allBtns = document.querySelectorAll('.am-btn-en, .am-btn-am');
                allBtns.forEach(b => b.style.pointerEvents = 'none');

                if(am_selectedEn.word.en === am_selectedAm.word.en) {
                    // Match!
                    feedback.innerHTML = `<span class="text-green-500">Great Match!</span>`;
                    playAudio("Correct", null);
                    
                    am_selectedEn.btn.classList.replace('bg-pink-200', 'bg-green-100');
                    am_selectedEn.btn.classList.replace('border-pink-500', 'border-green-400');
                    am_selectedEn.btn.classList.add('matched', 'opacity-60', 'text-green-700');
                    
                    am_selectedAm.btn.classList.replace('bg-teal-200', 'bg-green-100');
                    am_selectedAm.btn.classList.replace('border-teal-500', 'border-green-400');
                    am_selectedAm.btn.classList.add('matched', 'opacity-60', 'text-green-700');
                    
                    am_matchesFound++;
                    
                    if(am_matchesFound === am_totalPairs) {
                        setTimeout(() => {
                            document.getElementById('am-win-container').classList.remove('hidden');
                            feedback.innerHTML = "";
                        }, 500);
                    }
                } else {
                    // No match
                    feedback.innerHTML = `<span class="text-red-500">Oops, try again!</span>`;
                    am_selectedEn.btn.classList.add('animate-shake', 'bg-red-100', 'border-red-400');
                    am_selectedAm.btn.classList.add('animate-shake', 'bg-red-100', 'border-red-400');
                    
                    setTimeout(() => {
                        am_selectedEn.btn.classList.remove('bg-pink-200', 'border-pink-500', 'animate-shake', 'bg-red-100', 'border-red-400');
                        am_selectedAm.btn.classList.remove('bg-teal-200', 'border-teal-500', 'animate-shake', 'bg-red-100', 'border-red-400');
                        feedback.innerHTML = `Find ${am_totalPairs} matches!`;
                    }, 1000);
                }

                // Reset selection and unlock
                setTimeout(() => {
                    am_selectedEn = null;
                    am_selectedAm = null;
                    allBtns.forEach(b => {
                        if(!b.classList.contains('matched')) b.style.pointerEvents = 'auto';
                    });
                }, 1000);
            }
        }

        // Initialize App on Load
        window.onload = () => {
            initVoices();
            switchGame('flashcards'); // default view
        };

    </script>
</body>
</html>
